  <script>
    (function() {
      const wcTheme = localStorage.getItem('wcTheme');
      const savedTheme = localStorage.getItem('theme') || localStorage.getItem('wowchemy-theme');
      let isDark = false;
      if (wcTheme !== null) {
        const v = parseInt(wcTheme, 10);
        isDark = v === 1 || (v === 2 && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } else if (savedTheme) {
        isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
      document.body.classList.toggle('dark', isDark);
    })();
  </script>

      opacity: 0.75;

      mix-blend-mode: screen;

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function escapeAttr(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function openDetailImageLightbox(el) {

        document.body.style.overflow = 'hidden';

    function closeDetailImageLightbox(event) {
      if (event && event.target !== event.currentTarget) return;
      const lightbox = document.getElementById('detailImageLightbox');
      if (lightbox) {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

      if (e.key === 'Escape') closeDetailImageLightbox();

  <script>
    (function () {
      const overlay = document.createElement('div');
      overlay.id = 'fx-overlay';
      document.body.appendChild(overlay);

      const palette = [
        '#ff4c78', '#00b9ff', '#ffd200', '#7850ff', '#00ffc8', '#ff8a00'
      ];

      function hexToRgba(hex, alpha) {
        const h = hex.replace('#', '');
        const bigint = parseInt(h, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
      }

      function spawnParticle(container, x, y, opts) {
        const p = document.createElement('span');
        p.className = 'smoke-particle';
        const color = palette[Math.floor(Math.random() * palette.length)];
        const dx = (Math.random() * 100 - 50);
        const dy = -((opts && opts.dyMin !== undefined ? opts.dyMin : 30) + Math.random() * (opts && opts.dyRange !== undefined ? opts.dyRange : 60));
        const s = (opts && opts.scaleMin !== undefined ? opts.scaleMin : 1.8) + Math.random() * (opts && opts.scaleRange !== undefined ? opts.scaleRange : 1.8);
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.setProperty('--s', s);
        p.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), ' + hexToRgba(color, 0.85) + ' 45%, rgba(255,255,255,0) 70%)';
        container.appendChild(p);
        p.addEventListener('animationend', function () { p.remove(); });
      }

      function spawnBurst(container, x, y) {
        const b = document.createElement('span');
        b.className = 'smoke-burst';
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        container.appendChild(b);
        b.addEventListener('animationend', function () { b.remove(); });
      }

      function relativeToOverlay(evt) {
        const rect = overlay.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function handleGlobalClick(evt) {
        const xy = relativeToOverlay(evt);
        spawnBurst(overlay, xy.x, xy.y);
        const count = 10 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) {
          const jitterX = xy.x + (Math.random() * 16 - 8);
          const jitterY = xy.y + (Math.random() * 10 - 5);
          spawnParticle(overlay, jitterX, jitterY);
        }
      }

      var lastOverlayMove = 0;
      function handleGlobalMove(evt) {
        var now = Date.now();
        if (now - lastOverlayMove < 90) return;
        lastOverlayMove = now;
        const xy = relativeToOverlay(evt);
        const count = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < count; i++) {
          const jitterX = xy.x + (Math.random() * 10 - 5);
          const jitterY = xy.y + (Math.random() * 8 - 4);
          spawnParticle(overlay, jitterX, jitterY, { dyMin: 14, dyRange: 22, scaleMin: 1.4, scaleRange: 1.2 });
        }
      }

      window.addEventListener('click', handleGlobalClick);
      window.addEventListener('mousemove', handleGlobalMove);
      window.addEventListener('touchstart', function (evt) {
        const t = evt.touches[0];
        if (!t) return;
        const rect = overlay.getBoundingClientRect();
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        spawnBurst(overlay, x, y);
        const count = 10 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) spawnParticle(overlay, x, y);
      }, { passive: true });
    })();
  </script>
