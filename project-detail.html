  <script>
    (function () {
      const wcTheme = localStorage.getItem('wcTheme');
      const savedTheme = localStorage.getItem('theme') || localStorage.getItem('wowchemy-theme');
      let isDark = false;
      if (wcTheme !== null) {
        const v = parseInt(wcTheme, 10);
        isDark = v === 1 || (v === 2 && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } else if (savedTheme) {
        isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
      document.body.classList.toggle('dark', isDark);
    })();
  </script>

      z-index: 2;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: aboutSmokeParticle 1400ms ease-out forwards;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 65%);
    }

    @keyframes aboutSmokeParticle {
      0% {
        opacity: 0.85;
        transform: translate(calc(-50% + 0px), calc(-50% + 0px)) scale(1);
      }

      60% {
        opacity: 0.4;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -30px))) scale(var(--s, 2.2));
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -60px))) scale(var(--s, 3.2));
      }
    }

    .smoke-burst {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0.75;
      filter: blur(26px) hue-rotate(0deg);
      mix-blend-mode: screen;
      z-index: 1;
      background:
        radial-gradient(closest-side at 35% 35%, hsla(350, 100%, 62%, 0.35), transparent 70%),
        radial-gradient(closest-side at 70% 30%, hsla(45, 100%, 60%, 0.30), transparent 70%),

        radial-gradient(closest-side at 50% 50%, hsla(200, 100%, 60%, 0.26), transparent 70%);
      animation: aboutSmokeBurst 2200ms ease-out forwards;
    }

    #fx-overlay {

      z-index: 50;
      overflow: hidden;

    @keyframes aboutSmokeBurst {

      40% {

      }

      100% {

    function renderProject(id) {
      const project = projectsData[id];
      const content = document.getElementById('detailContent');
      const notFound = document.getElementById('detailNotFound');

      if (!project) {
        content.innerHTML = '';
        notFound.style.display = 'block';
        return;
      }

      document.title = project.title + ' - Siwani Sah';
      notFound.style.display = 'none';

      let html = '';

      html += '<article class="detail-hero">';
      html += '<div class="detail-year">' + escapeHtml(project.year) + '</div>';
      html += '<h1 class="detail-title">' + escapeHtml(project.title) + '</h1>';
      html += '<p class="detail-tagline">' + escapeHtml(project.tagline || project.description) + '</p>';
      if (project.links && project.links.length) {
        html += '<div class="detail-hero-links">';
        project.links.forEach(function (link) {
          html += '<a href="' + escapeAttr(link.url) + '" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> ' + escapeHtml(link.text) + '</a>';
        });
        html += '</div>';
      }
      if (project.image) {
        html += '<div class="detail-hero-image-wrap" role="button" tabindex="0" data-image="' + escapeAttr(project.image) + '" data-alt="' + escapeAttr(project.title) + '" onclick="openDetailImageLightbox(this)" onkeydown="if(event.key===\'Enter\')openDetailImageLightbox(this)">';
        html += '<img src="' + escapeAttr(project.image) + '" alt="' + escapeAttr(project.title) + '" class="detail-hero-image">';
        html += '</div>';
      }
      html += '</article>';

      // Screenshot gallery (hero image counts as first; show remaining in a grid)
      if (project.gallery && project.gallery.length) {
        html += '<div class="detail-section"><h2>Screenshots</h2><div class="detail-gallery">';
        project.gallery.forEach(function (g) {
          html += '<div class="detail-gallery-item" role="button" tabindex="0" data-image="' + escapeAttr(g.src) + '" data-alt="' + escapeAttr(g.alt) + '" onclick="openDetailImageLightbox(this)" onkeydown="if(event.key===\'Enter\')openDetailImageLightbox(this)">';
          html += '<img src="' + escapeAttr(g.src) + '" alt="' + escapeAttr(g.alt) + '" loading="lazy">';
          html += '</div>';
        });
        html += '</div></div>';
      }

      html += '<div class="detail-section"><h2>Overview</h2><p>' + escapeHtml(project.overview || project.description) + '</p></div>';

      if (project.goals) {
        html += '<div class="detail-section"><h2>Goals and Motivation</h2><p>' + escapeHtml(project.goals) + '</p></div>';
      }

      if (project.techStack && project.techStack.length) {
        html += '<div class="detail-section"><h2>Technologies</h2><div class="tech-stack-grid">';
        project.techStack.forEach(function (t) {
          html += '<div class="tech-stack-item"><h3>' + escapeHtml(t.name) + '</h3><p>' + escapeHtml(t.desc) + '</p></div>';
        });
        html += '</div></div>';
      }

      if (project.features && project.features.length) {
        html += '<div class="detail-section"><h2>Features</h2>';
        project.features.forEach(function (f) {
          html += '<div class="feature-item"><h3>' + escapeHtml(f.title) + '</h3><p>' + escapeHtml(f.desc) + '</p></div>';
        });
        html += '</div>';
      }

      if (project.details && project.details.length) {
        html += '<div class="detail-section"><h2>My contribution</h2><ul>';
        project.details.forEach(function (d) {
          html += '<li>' + escapeHtml(d) + '</li>';
        });
        html += '</ul></div>';
      }

      if (project.video) {
        html += '<div class="detail-section"><h2>Demo</h2><div class="detail-demo-video-wrap">';
        html += '<video class="detail-demo-video" src="' + escapeAttr(project.video) + '" controls playsinline preload="metadata" poster="' + (project.image ? escapeAttr(project.image) : '') + '">Your browser does not support the video tag.</video>';
        html += '</div></div>';

      if (project.challenges && project.challenges.length) {
        html += '<div class="detail-section"><h2>Challenges and solutions</h2>';
        project.challenges.forEach(function (c) {
          html += '<div class="challenge-block"><h3>' + escapeHtml(c.title) + '</h3><p>' + escapeHtml(c.content) + '</p></div>';
        });
        html += '</div>';

      if (project.futureExpansions && project.futureExpansions.length) {
        html += '<div class="detail-section"><h2>Possible next steps</h2>';
        project.futureExpansions.forEach(function (f) {
          html += '<div class="future-item"><h3>' + escapeHtml(f.title) + '</h3><p>' + escapeHtml(f.desc) + '</p></div>';
        });
        html += '</div>';

      if (project.outro) {
        html += '<div class="detail-section"><h2>Takeaway</h2><p class="detail-outro">' + escapeHtml(project.outro) + '</p></div>';

      if (project.links && project.links.length) {
        html += '<div class="detail-section"><h2>Repositories</h2><div class="detail-hero-links">';

      html += '<div class="detail-explore"><a href="projects.html">Explore more projects →</a></div>';
      html += '<a href="projects.html" class="detail-back"><i class="fas fa-arrow-left"></i> Back to Projects</a>';
      content.innerHTML = html;
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function escapeAttr(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function openDetailImageLightbox(el) {
      const src = el.getAttribute('data-image');
      const alt = el.getAttribute('data-alt') || '';
      const lightbox = document.getElementById('detailImageLightbox');
      const img = document.getElementById('detailLightboxImage');
      if (lightbox && img && src) {
        img.src = src;
        img.alt = alt;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeDetailImageLightbox(event) {
      if (event && event.target !== event.currentTarget) return;
      const lightbox = document.getElementById('detailImageLightbox');
      if (lightbox) {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDetailImageLightbox();
    });

    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      renderProject(id);
    })();
  </script>

  <script>
    (function () {
      const overlay = document.createElement('div');
      overlay.id = 'fx-overlay';
      document.body.appendChild(overlay);

      const palette = [
        '#ff4c78', '#00b9ff', '#ffd200', '#7850ff', '#00ffc8', '#ff8a00'
      ];

      function hexToRgba(hex, alpha) {
        const h = hex.replace('#', '');
        const bigint = parseInt(h, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
      }

      function spawnParticle(container, x, y, opts) {
        const p = document.createElement('span');
        p.className = 'smoke-particle';
        const color = palette[Math.floor(Math.random() * palette.length)];
        const dx = (Math.random() * 100 - 50);
        const dy = -((opts && opts.dyMin !== undefined ? opts.dyMin : 30) + Math.random() * (opts && opts.dyRange !== undefined ? opts.dyRange : 60));
        const s = (opts && opts.scaleMin !== undefined ? opts.scaleMin : 1.8) + Math.random() * (opts && opts.scaleRange !== undefined ? opts.scaleRange : 1.8);
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.setProperty('--s', s);
        p.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), ' + hexToRgba(color, 0.85) + ' 45%, rgba(255,255,255,0) 70%)';
        container.appendChild(p);
        p.addEventListener('animationend', function () { p.remove(); });
      }

      function spawnBurst(container, x, y) {
        const b = document.createElement('span');
        b.className = 'smoke-burst';
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        container.appendChild(b);
        b.addEventListener('animationend', function () { b.remove(); });
      }

      function relativeToOverlay(evt) {
        const rect = overlay.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function handleGlobalClick(evt) {
        const xy = relativeToOverlay(evt);
        spawnBurst(overlay, xy.x, xy.y);
        const count = 10 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) {
          const jitterX = xy.x + (Math.random() * 16 - 8);
          const jitterY = xy.y + (Math.random() * 10 - 5);
          spawnParticle(overlay, jitterX, jitterY);
        }
      }

      var lastOverlayMove = 0;
      function handleGlobalMove(evt) {
        var now = Date.now();
        if (now - lastOverlayMove < 90) return;
        lastOverlayMove = now;
        const xy = relativeToOverlay(evt);
        const count = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < count; i++) {
          const jitterX = xy.x + (Math.random() * 10 - 5);
          const jitterY = xy.y + (Math.random() * 8 - 4);
          spawnParticle(overlay, jitterX, jitterY, { dyMin: 14, dyRange: 22, scaleMin: 1.4, scaleRange: 1.2 });
        }
      }

      window.addEventListener('click', handleGlobalClick);
      window.addEventListener('mousemove', handleGlobalMove);
      window.addEventListener('touchstart', function (evt) {
        const t = evt.touches[0];
        if (!t) return;
        const rect = overlay.getBoundingClientRect();
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        spawnBurst(overlay, x, y);
        const count = 10 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) spawnParticle(overlay, x, y);
      }, { passive: true });
    })();
  </script>
